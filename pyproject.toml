[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "cellink-tools"
version = "0.2.0"
description = "cellink enables genetic analyses on single-cell data"
readme = "README.md"
license = { file = "LICENSE" }
maintainers = [
  { name = "Jan Engelmann", email = "jan.engelmann@helmholtz-munich.de" },
  { name = "Lucas Arnoldt", email = "lucas.arnoldt@helmholtz-munich.de" },
  { name = "Eva Holtkamp", email = "eva.holtkamp@helmholtz-munich.de" },
]

authors = [
  { name = "Jan Engelmann" },
  { name = "Lucas Arnoldt" },
  { name = "Eva Holtkamp" },
]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "adjusttext>=1.2",
  "anndata>=0.13.1",
  "dask[array]>=2024.12",
  "h5py>=3.12",
  "hidata>=0.1.0",
  "matplotlib>=3.10",
  "mudata>=0.3.1",
  "muon>=0.1.7",
  "numexpr>=2.10.2",
  "numpy>=2.2",
  "pandas>=2.3",
  "pandera>=0.24",
  "polars>=1.10",
  # sc.pp.neighbors fails above 8,192 cells with pynndescent 0.7 (run_scdrs, scPRS, scEPS)
  "pynndescent>=0.5.13,<0.7",
  "pyyaml>=6.0.2",
  "regex>=2024.11.6",
  "requests>=2.32",
  "rich>=13.9",
  "scanpy>=1.11.2",
  "scikit-learn>=1.6",
  "scipy>=1.15",
  "seaborn>=0.13.2",
  "session-info>=1",
  "tqdm>=4.66",
  "xarray>=2024.10",
  "zarr>=3.1",
]

optional-dependencies.at = [
  "formulaic>=1.1",
  "limix-core>=1.0.2",
]
optional-dependencies.datasets = [
  "bio2zarr[all]>=0.2",
  "liftover>=1.3.2",
  # sgkit 0.8 imports pkg_resources, which setuptools>=82 does not provide
  "setuptools>=70,<82",
  "sgkit[plink]>=0.8",
]
optional-dependencies.dev = [
  "pre-commit>=4",
  "twine>=4.0.2",
]
optional-dependencies.doc = [
  "docutils>=0.21",
  "ipykernel>=6.29",
  "ipython>=8.28",
  "linkify-it-py>=2",
  "myst-nb>=1.1.2",
  # Until pybtex >0.23.0 releases: https://bitbucket.org/pybtex-devs/pybtex/issues/169/
  "setuptools>=70",
  "sphinx>=8.1",
  "sphinx-autodoc-typehints>=2.4",
  "sphinx-book-theme>=1.1.3",
  "sphinx-copybutton>=0.5.2",
  "sphinx-tabs>=3.4.7",
  "sphinxcontrib-bibtex>=2.6.3",
  "sphinxext-opengraph>=0.9",
]
optional-dependencies.embpy = [
  "embpy>=9",
]
optional-dependencies.ensembl-vep = [
  # not available via pip, has to be installed via conda install bioconda::ensembl-vep
  #  "ensembl-vep",
]

optional-dependencies.jaxqtl = [
  # cellink.tl.external.run_jaxqtl runs the `jaxqtl` command line tool
  "jaxqtl>=0.3.1,<0.4",
]
optional-dependencies.ldsc = [
  # gsMap is installed in its own environment, with its `gsmap` executable on $PATH (see the
  # gsMap tutorial); cellink.tl.external.format_gsmap_sumstats / load_gsmap_results only read
  # and write files.
]
optional-dependencies.mixmil = [
  "mixmil>=0.1.2",
]
optional-dependencies.pgen = [
  "pgenlib>=0.92",
  "zarr>=3.1",
]

optional-dependencies.rvat = [
  # installation wit pip doesn't work, install via conda install -c conda-forge chiscore
  # "chiscore",
  "limix-core>=1.0.2",
  "pybiomart>=0.2",
]
optional-dependencies.saigeqtl = [
  # not available via pip; cellink.tl.external.run_saigeqtl shells out to
  # SAIGE-QTL's own R scripts via Rscript (see SAIGEQTLRunner). Install
  # SAIGE-QTL itself following https://github.com/weizhou0/qtl.
]
optional-dependencies.scdrs = [
  "scdrs>=1.0.2",
]
optional-dependencies.sclinker = [
  "torchnmf>=0.3.5",
]
optional-dependencies.scooby = [
  "accelerate>=1",
  "borzoi-pytorch>=0.4",
  "enformer-pytorch>=0.8.10",
  "torch>=2.6",
]
optional-dependencies.scpoli = [
  "pyarrow>=18",
  "scarches>=0.6.1",
  "scvi-tools>=1.2.2",
]
optional-dependencies.scprs = [
  "ncls>=0.0.68",
  "networkx>=3.4",
  "statsmodels>=0.14.4",
  "torch-geometric>=2.6",
]
optional-dependencies.seismic_torch = [
  "statsmodels>=0.14.4",
  "torch>=2.6",
]
optional-dependencies.snpeff = [
  # not available via pip, has to be installed via conda install bioconda::snpeff
  # "snpeff",
]
optional-dependencies.tensorqtl = [
  # q-values (mode="cis") need rpy2 plus R with the Bioconductor qvalue package (e.g. from conda)
  "rpy2>=3.6; python_version<'3.14'",
  # Python 3.12 and 3.13 only
  "tensorqtl==1.0.10; python_version<'3.14'",
  #"plink2"
]
optional-dependencies.test = [
  "coverage>=7.6.10",
  "pytest>=8.3",
]
# https://docs.pypi.org/project_metadata/#project-urls
urls.Documentation = "https://cellink-docs.readthedocs.io/"
urls.Homepage = "https://github.com/theislab/cellink"
urls.Source = "https://github.com/theislab/cellink"

scripts.cellink-pgen = "cellink.cli.pgen:main"
entry-points."zarr.codecs".cellink_pack2bit = "cellink.io._codecs:Pack2Bit"

[tool.hatch.build.targets.wheel]
packages = [ "src/cellink" ]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.default]
installer = "uv"
features = [ "dev" ]

[tool.hatch.envs.docs]
extra-features = [ "doc" ]
scripts.build = "sphinx-build -M html docs docs/_build {args}"
scripts.open = "python -m webbrowser -t docs/_build/html/index.html"
scripts.clean = "git clean -fdX -- {args:docs}"

[tool.hatch.envs.hatch-test]
features = [ "test" ]

[tool.ruff]
line-length = 120
src = [ "src" ]
extend-include = [ "*.ipynb" ]

format.docstring-code-format = true

lint.select = [
  "B",      # flake8-bugbear
  "BLE",    # flake8-blind-except
  "C4",     # flake8-comprehensions
  "D",      # pydocstyle
  "E",      # Error detected by Pycodestyle
  "F",      # Errors detected by Pyflakes
  "I",      # isort
  "RUF100", # Report unused noqa directives
  "TID",    # flake8-tidy-imports
  "UP",     # pyupgrade
  "W",      # Warning detected by Pycodestyle
]
lint.ignore = [
  "B008", # Errors from function calls in argument defaults. These are fine when the result is immutable.
  "D100", # Missing docstring in public module
  "D104", # Missing docstring in public package
  "D105", # __magic__ methods are often self-explanatory, allow missing docstrings
  "D107", # Missing docstring in __init__
  # Disable one in each pair of mutually incompatible rules
  "D203", # We don’t want a blank line before a class docstring
  "D213", # <> We want docstrings to start immediately after the opening triple quote
  "D400", # first line should end with a period [Bug: doesn’t work with single-line docstrings]
  "D401", # First line should be in imperative mood; try rephrasing
  "E501", # line too long -> we accept long comment lines; formatter gets rid of long code lines
  "E731", # Do not assign a lambda expression, use a def -> lambda expression assignments are convenient
  "E741", # allow I, O, l as variable names -> I is the identity matrix
]
lint.per-file-ignores."*/__init__.py" = [ "F401" ]
# tutorial/benchmark scripts and notebooks are not library code: no docstring
# requirements, bare expressions display cell output, imports and error handling
# don't follow strict production conventions
lint.per-file-ignores."docs/*" = [ "B007", "B018", "BLE001", "D", "E402", "I" ]
lint.per-file-ignores."tests/*" = [ "D", "E402" ]
lint.pydocstyle.convention = "numpy"

[tool.pyproject-fmt]
# keep the classifiers of every supported Python version (pyproject-fmt drops versions above this)
max_supported_python = "3.14"

[tool.pytest.ini_options]
testpaths = [ "tests" ]
xfail_strict = true
addopts = [
  "--import-mode=importlib", # allow using test files with same name
]
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = [ "cellink" ]
omit = [
  "**/test_*.py",
]

[tool.cruft]
skip = [
  "tests",
  "src/**/__init__.py",
  "src/**/basic.py",
  "docs/api.md",
  "docs/changelog.md",
  "docs/references.bib",
  "docs/references.md",
  "docs/notebooks/example.ipynb",
]
