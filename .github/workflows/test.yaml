name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 5 1,15 * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -e {0} # -e to fail on error

    strategy:
      fail-fast: false
      matrix:
        # Every supported Python with the newest dependencies, plus one job with every direct
        # dependency at its declared lower bound.
        include:
          - os: ubuntu-latest
            python: "3.12"
            resolution: highest
          - os: ubuntu-latest
            python: "3.13"
            resolution: highest
          - os: ubuntu-latest
            python: "3.14"
            resolution: highest
          - os: ubuntu-latest
            python: "3.12"
            resolution: lowest-direct
            name: "Minimum dependency versions"

    name: ${{ matrix.name }} Python ${{ matrix.python }} (${{ matrix.resolution }})

    env:
      OS: ${{ matrix.os }}
      PYTHON: ${{ matrix.python }}

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip uv
      - name: Install dependencies
        run: |
          uv pip install --system --resolution ${{ matrix.resolution }} ".[at,datasets,pgen,dev,test]"
      - name: Show installed versions
        run: |
          uv pip list --system
      - name: Test
        env:
          MPLBACKEND: agg
          PLATFORM: ${{ matrix.os }}
          DISPLAY: :42
        run: |
          coverage run -m pytest -v --color=yes
      - name: Report coverage
        run: |
          coverage report
      - name: Upload coverage
        uses: codecov/codecov-action@v3
